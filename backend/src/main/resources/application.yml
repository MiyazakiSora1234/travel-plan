spring:
  application:
    name: travel-plan-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/travel_plan}
    username: ${APP_DB_USER:travel_plan_app}
    password: ${APP_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  port: ${SERVER_PORT:8080}

# CI/CDのHealth Checkでのみ使用。/actuator/health以外は公開しない。
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.travelplan: INFO
